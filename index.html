<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pearson login Portal — </title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f5f7;color:#202124}
    .topbar{height:64px;background:#ffffff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
    .brand{font-weight:700;color:#6b168c}.demo{font-size:12px;background:#fff1b8;padding:7px 10px;border-radius:8px;color:#6b5200;font-weight:700}
    .screen{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:30px}
    .card{width:100%;max-width:410px;background:#fff;border-radius:16px;box-shadow:0 8px 30px #00000018;padding:32px}
    h1{margin:0 0 8px;font-size:26px}.muted{color:#70757a;margin:0 0 24px}
    label{display:block;font-size:14px;font-weight:700;margin:16px 0 7px}
    input{width:100%;padding:13px 14px;border:1px solid #c9cdd2;border-radius:9px;font-size:15px}
    button{border:0;border-radius:9px;padding:13px 16px;font-weight:700;cursor:pointer}
    .primary{width:100%;margin-top:22px;background:#7b168f;color:#fff}.primary:hover{background:#641174}
    .error{color:#b3261e;font-size:13px;margin-top:12px;display:none}
    #app{display:none;min-height:calc(100vh - 64px)}
    .layout{display:flex;min-height:calc(100vh - 64px)}
    .sidebar{width:240px;background:#fff;border-right:1px solid #ddd;padding:24px 14px}
    .userbox{padding:14px;margin-bottom:18px;background:#f7f1f8;border-radius:12px}
    .userbox strong{display:block}.userbox small{color:#666}
    .nav{width:100%;text-align:left;background:transparent;margin:4px 0;color:#333}
    .nav.active{background:#eee2f1;color:#6b168c}
    .main{flex:1;padding:28px;overflow:auto}
    .welcome{background:#fff;border-radius:14px;padding:24px;box-shadow:0 3px 15px #0000000d;margin-bottom:22px}
    .profile{display:none;background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 15px #0000000d}
    .profile img{display:block;width:100%;max-width:1024px;height:auto;margin:auto;border-radius:5px}
    .note{font-size:12px;color:#666;margin:12px 2px}
    @media(max-width:700px){.sidebar{width:180px}.main{padding:16px}.topbar{padding:0 14px}.screen{padding:16px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Pearson</div>
    <div class="logo">Login</div>
  </header>

  <section id="login" class="screen">
    <div class="card">
      <h1>Sign in</h1>
      <p class="muted">Pearson Profile Login</p>
      <form id="loginForm">
        <label for="name">Name</label>
        <input id="name" autocomplete="username" placeholder="Enter your name" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
        <button class="primary" type="submit">Login</button>
        <div id="error" class="error">Incorrect credentials.</div>
      </form>
      <p class="note">credentials
    </div>
  </section>

  <section id="app">
    <div class="layout">
      <aside class="sidebar">
        <div class="userbox"><strong id="sideName">Zunaid Mahmud</strong><small>Student account</small></div>
        <button class="nav active" id="homeBtn">⌂ Dashboard</button>
        <button class="nav" id="profileBtn">👤 Profile / Score Report</button>
        <button class="nav" id="logoutBtn">↪ Logout</button>
      </aside>
      <main class="main">
        <div id="welcome" class="welcome">
          <h2>Welcome, <span id="welcomeName">Zunaid Mahmud</span></h2>
          <p>Select <b>Profile / Score Report</b> from the menu to view the pearson test report.</p>
        </div>
        <div id="profile" class="profile">
          <h2>Profile / Score Report</h2>
          <p class="note">Test Report</p>
          <img src="score-report.png" alt="Supplied PTE Exam score report">
        </div>
      </main>
    </div>
  </section>

  <script>
    const login = document.getElementById('login');
    const app = document.getElementById('app');
    const profile = document.getElementById('profile');
    const welcome = document.getElementById('welcome');
    const error = document.getElementById('error');
    const nameInput = document.getElementById('name');
    const passwordInput = document.getElementById('password');

    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      if (nameInput.value.trim().toLowerCase() === 'zunaid' && passwordInput.value === '1234') {
        document.getElementById('welcomeName').textContent = nameInput.value.trim();
        document.getElementById('sideName').textContent = nameInput.value.trim();
        login.style.display = 'none';
        app.style.display = 'block';
        error.style.display = 'none';
      } else {
        error.style.display = 'block';
      }
    });

    document.getElementById('profileBtn').onclick = () => {
      welcome.style.display = 'none';
      profile.style.display = 'block';
      document.getElementById('profileBtn').classList.add('active');
      document.getElementById('homeBtn').classList.remove('active');
    };

    document.getElementById('homeBtn').onclick = () => {
      profile.style.display = 'none';
      welcome.style.display = 'block';
      document.getElementById('homeBtn').classList.add('active');
      document.getElementById('profileBtn').classList.remove('active');
    };

    document.getElementById('logoutBtn').onclick = () => {
      app.style.display = 'none';
      login.style.display = 'flex';
      nameInput.value = '';
      passwordInput.value = '';
      profile.style.display = 'none';
      welcome.style.display = 'block';
      document.getElementById('homeBtn').classList.add('active');
      document.getElementById('profileBtn').classList.remove('active');
    };
  </script>
</body>
</html>
